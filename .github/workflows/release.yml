name: Build Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check release version
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Windows build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Test and package
        id: package
        run: |
          cargo test --locked
          archive=$(packaging/package-win64.sh)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Scan the packaged Windows executable
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: packaging/scan-win64.sh "$ARCHIVE"
      - name: Attest the ZIP
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md "$ARCHIVE" dist/SHA256SUMS dist/clamav-report.txt
