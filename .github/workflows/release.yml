name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this main commit
        required: true
        type: string
      prerelease:
        description: Mark as prerelease (backend need not be active yet)
        type: boolean
        default: true
      publish:
        description: Publish after all checks, rather than leaving a draft
        type: boolean
        default: false
      submit_to_virustotal:
        description: Explicitly authorize submission of this exact release EXE to VirusTotal
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Find exact release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-v$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "live-match-collector").version')}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -z "$refs" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
            exit 0
          fi
          sha=$(awk -v ref="refs/tags/$tag^{}" '$2==ref {print $1}' <<< "$refs")
          sha="${sha:-$(awk -v ref="refs/tags/$tag" '$2==ref {print $1}' <<< "$refs")}"
          [[ "$sha" == "$GITHUB_SHA" ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_MODE: ${{ (inputs.prerelease) && 'prerelease' || 'stable' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize evidence
        run: |
          mkdir -p dist
          printf 'source=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/run-evidence.txt
      - name: Require configured release protections
        env:
          RELEASE_SECURITY_APPROVED: ${{ vars.RELEASE_SECURITY_APPROVED }}
        run: test "$RELEASE_SECURITY_APPROVED" = true
      - name: Require exact tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/release_checks.py tag
          python3 packaging/release_checks.py ci
          if [[ "$RELEASE_MODE" == stable ]]; then
            python3 packaging/release_checks.py preflight
          fi
      - name: Audit locked Rust dependencies again
        run: |
          cargo install --locked cargo-audit --version 0.23.0
          status=0
          cargo audit --deny warnings || status=$?
          printf 'cargo-audit-exit=%s\n' "$status" > dist/audit-status.txt
          exit "$status"
      - name: Install Windows build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup show
      - name: Test, package, scan and verify
        id: package
        run: bash packaging/build-checks.sh
      - name: VirusTotal report for the exact packaged EXE
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_ALLOW_UPLOAD: ${{ inputs.submit_to_virustotal }}
        run: |
          result=0
          python3 packaging/virustotal_report.py dist || result=$?
          if [[ -f dist/virustotal-report.md ]]; then
            cat dist/virustotal-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Retain text-only security evidence (including failures)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/run-evidence.txt
            dist/SHA256SUMS
            dist/SHA256SUMS.exe
            dist/Cargo.lock.sha256
            dist/build-environment.txt
            dist/dependency-gate.json
            dist/cargo-sbom.cdx.json
            dist/clamav-report.txt
            dist/virustotal-report.json
            dist/virustotal-report.md
            dist/audit-status.txt
      - name: Attest the ZIP, EXE and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            dist/live-match-collector.exe
            dist/cargo-sbom.cdx.json
      - name: Verify provenance and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: bash packaging/create-draft.sh "$ARCHIVE"
      - name: Publish verified release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          python3 packaging/release_checks.py tag
          python3 packaging/release_checks.py ci
          if [[ "$RELEASE_MODE" == stable ]]; then
            python3 packaging/release_checks.py preflight
          fi
          bash packaging/verify-package.sh "$ARCHIVE"
          python3 packaging/virustotal_report.py dist --verify
          python3 packaging/dependency_evidence.py dist --verify
          gh release edit "$RELEASE_TAG" --draft=false