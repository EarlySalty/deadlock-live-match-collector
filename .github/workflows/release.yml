name: Build Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Windows build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Test and package
        run: |
          cargo test --locked
          packaging/package-win64.sh
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Attest the ZIP
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*.zip
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Windows x64 collector with setup instructions and third-party notices. SHA256SUMS lists the ZIP checksum.' dist/*.zip dist/SHA256SUMS
