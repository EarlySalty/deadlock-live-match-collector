name: Build and publish Windows release

on:
  workflow_run:
    workflows: ["Check Windows build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'EarlySalty/deadlock-live-match-collector' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha))
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_MODE: prerelease
      RELEASE_TAG: v0.3.0
      RELEASE_PREVIEW_ENABLED: ${{ vars.RELEASE_PREVIEW_ENABLED }}
      CLAMAV_IMAGE: ${{ vars.RELEASE_CLAMAV_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Authorize trusted main and exact successful CI
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SECURITY_APPROVED: ${{ vars.RELEASE_SECURITY_APPROVED }}
        run: |
          set -euo pipefail
          test "$RELEASE_SECURITY_APPROVED" = true
          python3 packaging/release_policy.py
          python3 packaging/release_checks.py main
          python3 packaging/release_checks.py ci
          [[ "$CLAMAV_IMAGE" =~ ^clamav/clamav@sha256:[0-9a-f]{64}$ ]]
          # Never replace an existing release, even after a new push.
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          count=$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length' <<< "$releases")
          if [[ "$count" != 0 ]]; then
            jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length == 1 and .[0].draft == false and .[0].prerelease == true' <<< "$releases"
            echo 'Already published; version is immutable.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize evidence
        if: steps.scope.outputs.build == 'true'
        run: |
          mkdir -p dist
          printf 'source=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/run-evidence.txt
      - name: Audit locked Rust dependencies again
        if: steps.scope.outputs.build == 'true'
        run: |
          cargo install --locked cargo-audit --version 0.23.0
          status=0
          cargo audit --deny warnings || status=$?
          printf 'cargo-audit-exit=%s\n' "$status" > dist/audit-status.txt
          exit "$status"
      - name: Install Windows build tools
        if: steps.scope.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup show
      - name: Test, package, scan and verify
        if: steps.scope.outputs.build == 'true'
        run: bash packaging/build-checks.sh
      - name: VirusTotal report for the exact packaged EXE
        if: steps.scope.outputs.build == 'true'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_ALLOW_UPLOAD: ${{ vars.RELEASE_VT_UPLOAD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/release_policy.py
          python3 packaging/release_checks.py main
          python3 packaging/release_checks.py ci
          bash packaging/verify-package.sh "dist/live-match-collector-${RELEASE_TAG#v}-win64.zip"
          bash packaging/scan-virustotal.sh dist
      - name: Retain text-only security evidence
        if: always() && steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/run-evidence.txt
            dist/SHA256SUMS
            dist/SHA256SUMS.exe
            dist/Cargo.lock.sha256
            dist/build-environment.txt
            dist/dependency-gate.json
            dist/cargo-sbom.cdx.json
            dist/clamav-report.txt
            dist/virustotal-report.json
            dist/virustotal-report.md
            dist/audit-status.txt
            dist/reproducibility.txt
            dist/pe-evidence.txt
      - name: Attest exact verified ZIP, EXE and SBOM
        if: steps.scope.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/live-match-collector-0.3.0-win64.zip
            dist/live-match-collector.exe
            dist/cargo-sbom.cdx.json
      - name: Create immutable tag after all checks
        if: steps.scope.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 packaging/release_policy.py
          python3 packaging/release_checks.py main
          python3 packaging/release_checks.py ci
          bash packaging/verify-package.sh "dist/live-match-collector-${RELEASE_TAG#v}-win64.zip"
          python3 packaging/virustotal_report.py dist --verify
          python3 packaging/dependency_evidence.py dist --verify
          for subject in "dist/live-match-collector-${RELEASE_TAG#v}-win64.zip" dist/live-match-collector.exe dist/cargo-sbom.cdx.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          refs=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -z "$refs" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --jq '.ref'
          fi
          python3 packaging/release_checks.py tag
      - name: Create and verify protected draft
        if: steps.scope.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/create-draft.sh "dist/live-match-collector-${RELEASE_TAG#v}-win64.zip"
      - name: Publish verified pre-release by exact release ID
        if: steps.scope.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-verified.sh "dist/live-match-collector-${RELEASE_TAG#v}-win64.zip"
