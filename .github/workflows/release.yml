name: Build Windows release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact tag, successful CI and reachable API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/release_checks.py tag
          python3 packaging/release_checks.py ci
          python3 packaging/release_checks.py preflight
      - name: Install Windows build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup show
      - name: Test, package, scan and verify
        id: package
        run: bash packaging/build-checks.sh
      - name: Attest the ZIP
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            dist/live-match-collector.exe
      - name: Verify provenance and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: bash packaging/create-draft.sh "$ARCHIVE"
